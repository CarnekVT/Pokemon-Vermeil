; Vermeil Smooth Movement. Edita desde Mods > Movement Studio.
; [global] se aplica a todos los mapas. [map:17] puede sobrescribir opciones.
; El modo predeterminado mantiene 4 direcciones y movimiento por tiles.
[global]
directions=4
mode=grid
subtile_divisions=4
instant_turn=1
wall_slide=0
smooth_movement=1
camera_smoothing=35
