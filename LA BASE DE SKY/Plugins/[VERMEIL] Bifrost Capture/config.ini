; Bifröst Capture 0.8 - OW completo y control libre del jugador durante captura
; A mantener para apuntar. S cambia la seleccion al instante.
; W/AUX2 cambia modo Ball/Team solo dentro de apuntado.
; Shift/Z sigue siendo correr; D sigue abriendo accesos rapidos registrados.
; Q es Turbo; D es objetos registrados; Shift/Z es correr; F9 es debug.
; A: apuntar. S: cambiar Ball/Pokemon. W: modo, SOLO mientras se apunta.
; La rueda del mouse permite cambiar selecciones, click derecho alterna modo.
; W contextual no deshabilita otros usos de AUX2 fuera de la captura.
; La captura no suspende los fotogramas normales de Scene_Map.
; El preset bifrost sigue disponible en Maker Studio, sin eliminar su catalogo exclusivo
; Para usar toda la fauna de hierba como OW: profile=full_ow
; Modos de encuentro: classic / hybrid / overworld
; En modo completo, un OW natural generado es capturable aunque la lista
; Bifröst siga restringiendo los eventos manuales a legendarios.
; En OW completo, un sprite ausente omite el OW sin iniciar combate vanilla.
[global]

; Sistema
profile=full_ow
enabled=1
access_mode=always
hotkey=jumpup
control_mode=hold
ball_key=jumpdown
target_key=none
mode_key=aux2
contextual_mode_toggle=1
mouse_wheel_select=1
mouse_right_mode=1
remember_selection=1
debug_input_guard=1
allow_shared_bindings=0
ball_hold_mode_frames=22
capture_enabled=1
battle_enabled=1
restricted_species=0

; Encuentros
encounter_mode=overworld
spawn_chance=50
spawn_min_distance=3
spawn_max_distance=6
spawn_limit=5
spawn_lifetime=45
; Ratio extra de OW por paso, independiente de las tiradas de batalla.
ow_extra_spawn_chance=12
ow_extra_spawn_cooldown=7
spawn_filter=all
spawn_grass_only=1
spawn_allow_fishing=0
ow_form=0
ow_min_level=0
ow_max_level=0
ow_spawn_probability=100

; Lanzamiento
range=7
width=7
optimal_range=4
hit_near=100
hit_far=60
line_of_sight=1
aim_keyboard=1
aim_speed=5
aim_mouse=1
aim_target_radius=30
allow_empty_throw=0
throw_frames=18
throw_arc=36
aim_chain=0

; Captura
capture_floor=10
back_multiplier=175
critical_front=3
critical_back=35
critical_multiplier=250
instant_modifier=100
attempt_limit=0
consume_on_miss=1
; Confirmación visual independiente: sigue presente después de salir de apuntado
feedback_enabled=1
feedback_frames=150
feedback_enter_frames=12
feedback_hold_frames=72
feedback_exit_frames=16
feedback_queue_limit=5
feedback_sfx=1
capture_fx=1
capture_shakes=3
capture_shake_frames=10
impact_frames=3

; Comportamiento
reaction=flee
; Los temperamentos se pueden forzar por especie: [species:RAIKOU]
; temperament=timid/aggressive/neutral/mixed
temperament=mixed
neutral_weight=50
timid_weight=30
aggressive_weight=20
timid_alert_distance=4
aggressive_alert_distance=5
aggressive_attack_distance=1
aggressive_chase_speed=4
aggressive_level_bonus=2
alert_distance=3
flee_steps=5
flee_speed=4
flee_disappear_distance=9
flee_stuck_frames=90
alert_on_miss=1

; Diseño sonoro: referencias de PLA y Z-A, archivos propios en Audio/SE/Bifrost
; vanilla = efectos de Essentials; original = solo archivos asignados; muted = silencio.
audio_profile=pla_like
sfx_aim=none
sfx_switch=none
sfx_mode=none
sfx_party=none
sfx_lock=none
sfx_throw=none
sfx_hit=none
sfx_shake=none
sfx_caught=none
sfx_breakout=none
sfx_flee=none
sfx_alert=none

; Ejemplos de ambitos: [map:12], [species:RAIKOU], [event:12:4]
