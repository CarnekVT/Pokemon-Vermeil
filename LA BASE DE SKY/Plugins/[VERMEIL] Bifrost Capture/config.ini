; Bifröst Capture - OW completo activado para pruebas en Vermeil
; El preset bifrost sigue disponible en Maker Studio, sin eliminar su catalogo exclusivo
; Para usar toda la fauna de hierba como OW: profile=full_ow
; Modos de encuentro: classic / hybrid / overworld
; En modo completo, un OW natural generado es capturable aunque la lista
; Bifröst siga restringiendo los eventos manuales a legendarios.
; Faltan sprites de Followers? Se usa combate vanilla como salida segura.
[global]

; Sistema
profile=full_ow
enabled=1
access_mode=always
hotkey=aux2
control_mode=toggle
capture_enabled=1
battle_enabled=1
restricted_species=0

; Encuentros
encounter_mode=overworld
spawn_chance=50
spawn_min_distance=3
spawn_max_distance=6
spawn_limit=5
spawn_lifetime=45
spawn_filter=all
spawn_grass_only=1
spawn_allow_fishing=0
ow_form=0
ow_min_level=0
ow_max_level=0
ow_spawn_probability=100

; Lanzamiento
range=7
width=7
optimal_range=4
hit_near=100
hit_far=60
line_of_sight=1
aim_keyboard=1
aim_speed=5
aim_mouse=1
aim_target_radius=30
allow_empty_throw=0
throw_frames=18
throw_arc=36
aim_chain=1

; Captura
capture_floor=10
back_multiplier=175
critical_front=3
critical_back=35
critical_multiplier=250
instant_modifier=100
attempt_limit=0
consume_on_miss=1
capture_shakes=3
capture_shake_frames=10
impact_frames=3

; Comportamiento
reaction=flee
alert_distance=3
flee_steps=5
flee_speed=4
flee_disappear_distance=9
flee_stuck_frames=90
alert_on_miss=1

; Ejemplos de ambitos: [map:12], [species:RAIKOU], [event:12:4]
