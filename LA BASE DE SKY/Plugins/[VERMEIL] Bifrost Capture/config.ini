; Bifrost Capture v0.1 - perfil inicial para Vermeil
[global]
profile=bifrost
enabled=1
; event = solo comando de evento (base Bifröst)
; always = tecla disponible en cualquier mapa libre
; nearby = tecla disponible con OW elegible en el area frontal
access_mode=event
; aux2 = R, aux1 = L, none = sin atajo
hotkey=aux2
capture_enabled=1
battle_enabled=1
restricted_species=1
range=7
width=7
optimal_range=4
alert_distance=3
hit_near=96
hit_far=60
capture_floor=10
back_multiplier=175
critical_front=3
critical_back=35
critical_multiplier=250
line_of_sight=1
reaction=flee
consume_on_miss=1
impact_frames=3
; Encuentros: classic (original), hybrid (ambos), overworld (100% OW terrestre)
encounter_mode=classic
; Parametros de fauna OW (solo hybrid/overworld)
spawn_chance=24
spawn_min_distance=3
spawn_max_distance=6
spawn_limit=4
spawn_lifetime=40
spawn_filter=all
spawn_grass_only=1
spawn_allow_fishing=0
; Opciones disponibles en ambitos de especie (0 = nivel original / forma normal)
ow_form=0
ow_min_level=0
ow_max_level=0
ow_spawn_probability=100
; [map:12], [species:RAIKOU] y [event:12:4] sobrescriben estas opciones
