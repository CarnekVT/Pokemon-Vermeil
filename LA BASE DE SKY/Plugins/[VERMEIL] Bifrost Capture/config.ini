; Bifröst Capture - controles con o sin mouse.
; A: mantener para apuntar y soltar para lanzar. C: lanzar. X: cancelar.
; S: siguiente Ball/Pokemon; Mayús+S: anterior.
; Mantener S nunca alterna Ball/Team. E es el cambio de modo.
; TAB: siguiente objetivo; Mayús+TAB: objetivo anterior.
; E: alternar Ball/Team directamente (también clic derecho).
; TAB/E funcionan SOLO mientras se apunta y se pueden cambiar abajo.
; Movimiento con flechas; D registrados, W debug pasabilidades,
; Q Turbo, Shift/Z correr, F9 debug: todas estas funciones se conservan.
; El mouse sigue disponible (rueda para ciclo, clic derecho para modo).
; Configuración experimental Vermeil: overworld completo.

[global]

; Sistema
profile=full_ow
enabled=1
access_mode=always
hotkey=jumpup
control_mode=hold
ball_key=jumpdown
target_key=none
mode_key=none
; Atajos de teclado físicos de mkxp-z, adicionales a los de F1.
; Valores admitidos: tab, e, r, f, t, g, none.
keyboard_target_key=tab
keyboard_mode_key=e
; R abre/cierra el modo de cebo/baya sin alterar E (Ball/Equipo).
keyboard_bait_key=r
contextual_mode_toggle=0
mode_double_tap_frames=0
mouse_wheel_select=1
mouse_right_mode=1
remember_selection=1
debug_input_guard=1
allow_shared_bindings=0
; ball_hold_mode_frames está obsoleto: el tiempo de S ya no cambia de modo.
; ball_hold_mode_frames=10
; Guía contextual dentro del HUD: auto / always / off.
; auto se expande brevemente y luego muestra accesos compactos.
hud_controls=auto
hud_controls_intro_frames=150
hud_position=bottom_right
hud_scale=100
hud_opacity=94
hud_offset_x=0
hud_offset_y=0
temperament_indicators=1
capture_enabled=1
battle_enabled=1
restricted_species=0

; Encuentros
encounter_mode=overworld
spawn_chance=50
spawn_min_distance=3
spawn_max_distance=6
spawn_limit=5
spawn_lifetime=45
; Ratio extra de OW por paso, independiente de las tiradas de batalla.
ow_extra_spawn_chance=12
ow_extra_spawn_cooldown=7
spawn_filter=all
spawn_grass_only=1
spawn_allow_fishing=0
ow_form=0
ow_min_level=0
ow_max_level=0
ow_spawn_probability=100
; PRUEBA EXPLÍCITA: fuerza shiny OW sin $DEBUG. Desactivar después de testear.
debug_force_shiny=0

; Lanzamiento
range=7
width=7
optimal_range=4
hit_near=100
hit_far=60
line_of_sight=1
aim_keyboard=1
aim_speed=5
aim_mouse=1
aim_target_radius=30
allow_empty_throw=0
throw_frames=18
throw_arc=36
aim_chain=1
max_flights=3
throw_cooldown_frames=17
spawn_intro_frames=26

; Captura
capture_floor=10
back_multiplier=175
critical_front=3
critical_back=35
critical_multiplier=250
instant_modifier=100
attempt_limit=0
; Presión que crece al insistir y baja con el tiempo o tras una victoria.
pressure_enabled=1
pressure_decay_frames=24
pressure_miss=18
pressure_breakout=24
pressure_repeat=10
pressure_front=14
pressure_back=8
pressure_alert_threshold=35
pressure_block_threshold=80
pressure_escape_frames=360
consume_on_miss=1
; Confirmación visual independiente: sigue presente después de salir de apuntado
feedback_enabled=1
feedback_frames=150
feedback_enter_frames=12
feedback_hold_frames=72
feedback_exit_frames=16
feedback_queue_limit=5
feedback_stack_count=3
feedback_sfx=1
capture_fx=1
capture_shakes=3
capture_shake_frames=10
impact_frames=3

; Comportamiento
reaction=flee
; Los temperamentos se pueden forzar por especie: [species:RAIKOU]
; temperament=timid/aggressive/neutral/mixed
temperament=mixed
neutral_weight=50
timid_weight=30
aggressive_weight=20
timid_alert_distance=4
aggressive_alert_distance=5
aggressive_attack_distance=1
aggressive_chase_speed=5
aggressive_notice_frames=25
aggressive_step_pause=3
aggressive_attack_windup=24
aggressive_lunge_distance=3
aggressive_lunge_speed=5
aggressive_charge_steps=2
escape_reaction_enabled=1
escape_reaction_chance=25
escape_reaction_hp_percent=8
escape_reaction_windup=30
escape_lunge_delay=14
escape_reaction_recovery=180
escape_reaction_range=4
aggressive_level_bonus=2
alert_distance=3
timid_reaction_frames=48
flee_steps=5
flee_speed=4
flee_disappear_distance=9
flee_stuck_frames=90
alert_on_miss=1

; Diseño sonoro: referencias de PLA y Z-A, archivos propios en Audio/SE/Bifrost
; vanilla = efectos de Essentials; original = solo archivos asignados; muted = silencio.
audio_profile=za_like
sfx_aim=none
sfx_switch=none
sfx_mode=none
sfx_party=none
sfx_lock=none
sfx_throw=none
sfx_hit=none
sfx_shake=none
sfx_caught=none
sfx_breakout=none
sfx_flee=none
sfx_alert=none
sfx_critical=none
; Shiny: rafaga al aparecer + destellos periodicos de bajo coste.
shiny_fx_enabled=1
shiny_fx_intensity=2
shiny_pulse_frames=150
shiny_sound_enabled=1
shiny_sound_volume=85
shiny_sound_pitch=112
; Evitar avisos sonoros repetitivos: 0 = solo aparicion, 1 = repeticion suave.
shiny_repeat_sound=0
; Puedes usar un audio propio/autorizado en Audio/SE/Bifrost/shiny.ogg
sfx_shiny=none
; Contraste sonoro cuando la Ball impacta por detras o una baya calma.
sfx_backstrike=none
sfx_calmed=none

; Ejemplos de ambitos: [map:12], [species:RAIKOU], [event:12:4]
