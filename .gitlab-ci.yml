stages:
  - notify
  - release
  # - build

notify-discord:
  stage: notify
  image: alpine:latest
  tags:
    - self-hosted
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"
  before_script:
    - apk add --no-cache curl git
  script:
    - |
      set -euo pipefail

      if [ -z "${DISCORD_COMMIT_WEBHOOK_URL:-}" ]; then
        echo "ERROR: DISCORD_COMMIT_WEBHOOK_URL variable is not set."
        echo "Add it in Settings > CI/CD > Variables"
        exit 1
      fi

      COMMIT_URL="${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}"

      # Build commit list from all commits in this push
      ZERO_SHA="0000000000000000000000000000000000000000"
      if [ "${CI_COMMIT_BEFORE_SHA}" = "${ZERO_SHA}" ]; then
        # First push to branch — just show the HEAD commit
        COMMIT_LIST=$(git log -1 --format="[\`%h\`](${CI_PROJECT_URL}/-/commit/%H) — %s")
        TITLE_URL="${COMMIT_URL}"
      else
        COMMIT_LIST=$(git log --reverse --format="[\`%h\`](${CI_PROJECT_URL}/-/commit/%H) — %s" "${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}")
        TITLE_URL="${CI_PROJECT_URL}/-/compare/${CI_COMMIT_BEFORE_SHA}...${CI_COMMIT_SHA}"
      fi

      # Truncate to 4096 chars (Discord embed description limit)
      COMMIT_LIST=$(echo "$COMMIT_LIST" | head -c 4000)

      # Set title based on number of commits
      COMMIT_COUNT=$(echo "$COMMIT_LIST" | wc -l)
      if [ "$COMMIT_COUNT" -gt 1 ]; then
        TITLE="🔧 ${COMMIT_COUNT} nuevos commits en dev"
      else
        TITLE="🔧 Nuevo commit en dev"
      fi

      # Escape special JSON characters in the commit list
      COMMIT_LIST_ESCAPED=$(printf '%s' "$COMMIT_LIST" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read())[1:-1])' 2>/dev/null || \
        printf '%s' "$COMMIT_LIST" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\t/\\t/g' | awk '{printf "%s\\n", $0}' | sed '$ s/\\n$//')

      DISCORD_PAYLOAD=$(cat <<EOF
      {
        "embeds": [{
          "title": "${TITLE}",
          "url": "${TITLE_URL}",
          "description": "${COMMIT_LIST_ESCAPED}",
          "color": 3447003,
          "fields": [
            {
              "name": "Autor",
              "value": "${GITLAB_USER_LOGIN}",
              "inline": true
            },
            {
              "name": "Branch",
              "value": "[dev](${CI_PROJECT_URL}/-/tree/dev)",
              "inline": true
            }
          ],
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
        }]
      }
      EOF
      )

      curl -f -H "Content-Type: application/json" \
        -d "$DISCORD_PAYLOAD" \
        "${DISCORD_COMMIT_WEBHOOK_URL}"

      echo "Discord notification sent!"

release:
  stage: release
  image: ruby:latest
  tags:
    - self-hosted
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update -qq && apt-get install -y -qq zip curl jq > /dev/null
  script:
    - |
      set -euo pipefail

      # Check if RELEASE_TOKEN_BASE token is available
      if [ -z "${RELEASE_TOKEN_BASE:-}" ]; then
        echo "ERROR: RELEASE_TOKEN_BASE variable is not set or not accessible."
        echo "Please check:"
        echo "1. The variable exists in Settings > CI/CD > Variables"
        echo "2. If the variable is 'Protected', either:"
        echo "   - Uncheck 'Protected' to allow use in all pipelines, OR"
        echo "   - Make sure your tag is created from a protected branch"
        exit 1
      fi

      # Build the zip
      cd "LA BASE DE SKY" && ruby scripts_combine.rb && cd ..

      ZIP_FILE="LA_BASE_DE_SKY_V${CI_COMMIT_TAG}.zip"
      STATIC_ZIP="LA_BASE_DE_SKY.zip"
      zip -r "$STATIC_ZIP" . -i "LA BASE DE SKY/*" "README.md" -x "LA BASE DE SKY/rgss-compiler.json" "LA BASE DE SKY/.ruby-lsp/*"

      # Fetch release name from GitLab API
      echo "Fetching release information for tag ${CI_COMMIT_TAG}"
      curl --silent --header "PRIVATE-TOKEN: ${RELEASE_TOKEN_BASE}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}" > release_info.json || true
      RELEASE_NAME=$(jq -r '.name // ""' release_info.json)
      if [ -n "$RELEASE_NAME" ]; then
        echo "Release name: ${RELEASE_NAME}"
      else
        echo "No release name found, using tag: ${CI_COMMIT_TAG}"
        RELEASE_NAME="${CI_COMMIT_TAG}"
      fi

      # Upload to Generic Package Registry for permanent "latest" URL
      echo "Uploading to Package Registry..."
      curl --header "PRIVATE-TOKEN: ${RELEASE_TOKEN_BASE}" \
        --upload-file "${STATIC_ZIP}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/La-Base-de-Sky/${CI_COMMIT_TAG}/${ZIP_FILE}"
      curl --header "PRIVATE-TOKEN: ${RELEASE_TOKEN_BASE}" \
        --upload-file "${STATIC_ZIP}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/La-Base-de-Sky/latest/${STATIC_ZIP}"

      DOWNLOAD_URL="${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/${STATIC_ZIP}"
      LATEST_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/La-Base-de-Sky/latest/${STATIC_ZIP}"

      echo "Artifact download URL (this version): ${DOWNLOAD_URL}"
      echo "Latest version URL (always current): ${LATEST_URL}"

      # Get previous tag for changelog comparison
      echo "Finding previous release..."
      git fetch --tags
      PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${CI_COMMIT_TAG}$" | head -n1 || echo "")

      if [ -n "$PREVIOUS_TAG" ]; then
        echo "Previous tag: ${PREVIOUS_TAG}"
        COMPARE_URL="${CI_PROJECT_URL}/-/compare/${PREVIOUS_TAG}...${CI_COMMIT_TAG}"
        CHANGELOG_NOTE="**[Ver cambios desde ${PREVIOUS_TAG}](${COMPARE_URL})**"
      fi

      # Update release description with changelog link
      CURRENT_DESCRIPTION=$(jq -r '.description // ""' release_info.json)
      if [ -n "$CURRENT_DESCRIPTION" ]; then
        NEW_DESCRIPTION="${CURRENT_DESCRIPTION}\n\n---\n\n${CHANGELOG_NOTE}"
      else
        NEW_DESCRIPTION="${CHANGELOG_NOTE}"
      fi

      curl --request PUT \
        --header "PRIVATE-TOKEN: ${RELEASE_TOKEN_BASE}" \
        --data-urlencode "description=${NEW_DESCRIPTION}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}"

      # Add asset link to release
      echo "Adding asset link to release ${CI_COMMIT_TAG}"
      curl --request POST \
        --header "PRIVATE-TOKEN: ${RELEASE_TOKEN_BASE}" \
        --data "name=${ZIP_FILE}" \
        --data "url=${DOWNLOAD_URL}" \
        --data "link_type=package" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"

      echo ""
      echo "¡Se creó el release exitosamente!"
      echo "Download URL: ${DOWNLOAD_URL}"
      echo "URL estática al último release: ${LATEST_URL}"

      # Send Discord notification
      if [ -z "${DISCORD_RELEASE_WEBHOOK_URL:-}" ]; then
        echo "Warning: DISCORD_RELEASE_WEBHOOK_URL not set, skipping Discord notification"
      else
        echo "Sending Discord notification..."

        if [[ "${RELEASE_NAME}" == *"${CI_COMMIT_TAG}"* ]]; then
          DISPLAY_NAME="${RELEASE_NAME}"
        else
          DISPLAY_NAME="${RELEASE_NAME} v${CI_COMMIT_TAG}"
        fi

        TITLE_NAME="${RELEASE_NAME}"
        TITLE_NAME=$(echo "${TITLE_NAME}" | sed -E 's/[[:space:]]*v?[0-9]+\.[0-9]+(\.[0-9]+)?[[:space:]]*$//')

        RELEASE_URL="${CI_PROJECT_URL}/-/releases/${CI_COMMIT_TAG}"

        DISCORD_PAYLOAD=$(cat <<EOF
      {
        "embeds": [{
          "title": "🎉 Nueva versión disponible de ${TITLE_NAME}",
          "url": "${RELEASE_URL}",
          "description": "Se ha publicado **${DISPLAY_NAME}**",
          "color": 5814783,
          "fields": [
            {
              "name": "📥 Descargar",
              "value": "[**${ZIP_FILE}**](${LATEST_URL})",
              "inline": false
            },
            {
              "name": "📋 Ver cambios",
              "value": "${CHANGELOG_NOTE:-No hay cambios registrados}",
              "inline": false
            }
          ],
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
        }]
      }
      EOF
        )

        curl -f -H "Content-Type: application/json" \
          -d "$DISCORD_PAYLOAD" \
          "${DISCORD_RELEASE_WEBHOOK_URL}" || echo "Warning: Failed to send Discord notification"

        echo "Discord notification sent successfully!"
      fi
  artifacts:
    name: "LA_BASE_DE_SKY_V${CI_COMMIT_TAG}"
    paths:
      - "LA_BASE_DE_SKY.zip"
    expire_in: never

