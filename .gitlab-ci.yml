      # {
      #   "embeds": [{
      #     "title": "🎉 Nueva versión disponible de ${TITLE_NAME}",
      #     "description": "Se ha publicado **${DISPLAY_NAME}**",
      #     "color": 5814783,
      #     "fields": [
      #       {
      #         "name": "📥 Descargar",
      #         "value": "[**${ZIP_FILE}**](${LATEST_URL})",
      #         "inline": false
      #       },
      #       {
      #         "name": "📋 Ver cambios",
      #         "value": "${CHANGELOG_NOTE:-No hay cambios registrados}",
      #         "inline": false
      #       }
      #     ],
      #     "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
      #   }]
      # }
      # EOF
      #   )

      #   curl -H "Content-Type: application/json" \
      #     -d "$DISCORD_PAYLOAD" \
