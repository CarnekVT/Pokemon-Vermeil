name: Bifrost Capture studio checks
on:
  push:
    branches: [feature/bifrost-overworld-capture-studio]
    paths:
      - 'LA BASE DE SKY/Plugins/[VERMEIL] Bifrost Capture/**'
      - 'LA BASE DE SKY/Plugins/Battle Additions/Abilities/180_SuncoronaEclipsoraAbilities.rb'
      - 'LA BASE DE SKY/Plugins/Carnek Project Settings/patches/040_SleepAnimations.rb'
      - 'LA BASE DE SKY/Plugins/MakerStudio/003_Editor/Mods/com.vermeil.bifrost-capture/**'
      - 'tests/bifrost_capture_*_test.rb'
      - '.github/workflows/bifrost-capture-check.yml'
  workflow_dispatch:

jobs:
  syntax_and_core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Ruby Essentials plugin syntax
        working-directory: LA BASE DE SKY
        run: |
          for f in 'Plugins/[VERMEIL] Bifrost Capture/'*.rb; do
            ruby -c "$f"
          done
      - name: Check Maker Studio JavaScript syntax
        working-directory: LA BASE DE SKY
        run: |
          for f in Plugins/MakerStudio/003_Editor/Mods/com.vermeil.bifrost-capture/*.js; do
            node --input-type=module --check < "$f"
          done
      - name: Run geometry and profiles tests
        run: ruby tests/bifrost_capture_core_test.rb
      - name: Validate aiming and hitting without mkxp
        run: ruby tests/bifrost_capture_aim_test.rb
      - name: Verify free movement while aiming
        run: ruby tests/bifrost_capture_live_test.rb
      - name: Verify Legends-style left slide and result queue
        run: ruby tests/bifrost_capture_feedback_test.rb
      - name: Verify battle frame-update alias chaining is safe
        run: ruby tests/bifrost_capture_battle_patch_test.rb
