name: Input Studio regression checks
on:
  push:
    branches:
      - new-MK-for-2.5D-Testeo
    paths:
      - 'LA BASE DE SKY/Plugins/[VERMEIL] Input Studio/**'
      - 'LA BASE DE SKY/DeveloperTests/input_studio_regression.rb'
      - '.github/workflows/input-studio-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Check Ruby syntax
        shell: bash
        run: |
          ruby -c 'LA BASE DE SKY/Plugins/[VERMEIL] Input Studio/001_Core.rb'
          ruby -c 'LA BASE DE SKY/Plugins/[VERMEIL] Input Studio/002_Overlay.rb'
          ruby -c 'LA BASE DE SKY/DeveloperTests/input_studio_regression.rb'
      - name: Run Input Studio logic regressions
        run: ruby 'LA BASE DE SKY/DeveloperTests/input_studio_regression.rb'
