name: Interface Studio regression checks
on:
  push:
    branches:
      - new-MK-for-2.5D-Testeo
    paths:
      - 'LA BASE DE SKY/Plugins/MakerStudio/003_Editor/Mods/com.soysandi.interfaces/**'
      - '.github/workflows/interfaces-studio-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          ROOT='LA BASE DE SKY/Plugins/MakerStudio/003_Editor/Mods/com.soysandi.interfaces'
          find "$ROOT" -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Validando $file"
            node --check "$file"
          done
      - name: Verify original editor compatibility
        shell: bash
        run: |
          ROOT='LA BASE DE SKY/Plugins/MakerStudio/003_Editor/Mods/com.soysandi.interfaces'
          node --experimental-default-type=module --test "$ROOT/tests/workspace.test.mjs"
