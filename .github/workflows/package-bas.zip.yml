name: Build BAS editor and runtime ZIP
on:
  push:
    branches:
      - rescate-makerstudio-mods-2026-10-10
    paths:
      - 'LA BASE DE SKY/Plugins/MakerStudio/003_Editor/Mods/Battle Animation Studio/**'
      - 'LA BASE DE SKY/Plugins/Battle Animation Studio Runtime/**'
      - 'BAS_INSTALL_README.md'
      - '.github/workflows/package-bas.zip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack-bas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'bas-package/LA BASE DE SKY/Plugins/MakerStudio/003_Editor/Mods'
          mkdir -p 'bas-package/LA BASE DE SKY/Plugins'
          cp -a 'LA BASE DE SKY/Plugins/MakerStudio/003_Editor/Mods/Battle Animation Studio' 'bas-package/LA BASE DE SKY/Plugins/MakerStudio/003_Editor/Mods/'
          cp -a 'LA BASE DE SKY/Plugins/Battle Animation Studio Runtime' 'bas-package/LA BASE DE SKY/Plugins/'
          cp -a 'BAS_INSTALL_README.md' 'bas-package/README_INSTALACION.md'
          cd bas-package
          zip -qr '../Battle_Animation_Studio_1.0.87_Editor_Runtime.zip' .
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Battle_Animation_Studio_1.0.87_Editor_Runtime
          path: Battle_Animation_Studio_1.0.87_Editor_Runtime.zip
          if-no-files-found: error
          retention-days: 30
