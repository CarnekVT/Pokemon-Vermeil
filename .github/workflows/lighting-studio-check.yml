name: Lighting Studio checks
on:
  push:
    branches: [new-MK-for-2.5D-Testeo]
    paths:
      - 'LA BASE DE SKY/Plugins/Lighting Studio Runtime/**'
      - 'LA BASE DE SKY/Plugins/MakerStudio/003_Editor/Mods/Lighting Studio/**'
      - 'LA BASE DE SKY/DeveloperTests/LightingStudio/**'
      - '.github/workflows/lighting-studio-check.yml'
  workflow_dispatch:

jobs:
  ruby_and_javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Ruby runtime syntax
        working-directory: LA BASE DE SKY
        run: |
          for f in "Plugins/Lighting Studio Runtime/"*.rb; do ruby -c "$f"; done
      - name: Run Ruby normals regression
        working-directory: LA BASE DE SKY
        run: ruby "DeveloperTests/LightingStudio/test_character_normals.rb"
      - name: Test internal clock and Sleeping Bag
        working-directory: LA BASE DE SKY
        run: ruby "DeveloperTests/LightingStudio/test_daynight.rb"
      - name: Test day-night clock and fixed Sleeping Bag hours
        working-directory: LA BASE DE SKY
        run: ruby "DeveloperTests/LightingStudio/test_day_night.rb"
      - name: Check editor JavaScript syntax
        working-directory: LA BASE DE SKY
        run: |
          for f in "Plugins/MakerStudio/003_Editor/Mods/Lighting Studio/"*.js; do
            node --experimental-default-type=module --check "$f"
          done
      - name: Test model, masks and day-night timeline
        working-directory: LA BASE DE SKY
        run: node --experimental-default-type=module "DeveloperTests/LightingStudio/test_model.mjs"
      - name: Test mask painter cave silhouettes and PNG export
        working-directory: LA BASE DE SKY
        run: node --experimental-default-type=module "DeveloperTests/LightingStudio/test_mask_editor.mjs"
      - name: Match native autotile zoom and mask hitboxes
        working-directory: LA BASE DE SKY
        run: node --experimental-default-type=module "DeveloperTests/LightingStudio/test_zoom_lighting.mjs"
